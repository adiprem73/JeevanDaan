<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeevandaan - Medicine Info Finder</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body id="top">

    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="./assets/images/logofinal.png" width="200" height="46" alt="Jeevandaan">
            </a>

            <nav class="navbar">
                <ul class="navbar-list">
                    <li class="navbar-item">
                        <a href="../profile.html" class="navbar-link profile-avatar" title="Profile">
                            <img src="./assets/images/doctorr.png" alt="Profile avatar" class="avatar-img">
                        </a>
                    </li>
                    <li class="navbar-item dropdown">
                        <a href="#" class="navbar-link"><i class="fa-solid fa-language"></i> LANGUAGE</a>
                        <div class="dropdown-content">
                            <a href="#">Hindi</a>
                            <a href="#">English</a>
                            <a href="#">Bengali</a>
                            <a href="#">Telugu</a>
                            <a href="#">Marathi</a>
                            <a href="#">Tamil</a>
                            <a href="#">Urdu</a>
                            <a href="#">Gujarati</a>
                            <a href="#">Kannada</a>
                            <a href="#">Odia</a>
                            <a href="#">Punjabi</a>
                            <a href="#">Malayalam</a>
                            <a href="#">Assamese</a>
                            <a href="#">Maithili</a>
                            <a href="#">Sanskrit</a>
                            <a href="#">Kashmiri</a>
                        </div>
                    </li>
                    <li class="navbar-item">
                        <button class="navbar-link"><i class="fa-solid fa-truck-medical"></i> EMERGENCY</button>
                    </li>
                    <li class="navbar-item">
                        <a href="#contact" class="navbar-link"><i class="fa-solid fa-phone"></i> CONTACT US</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- Medicine Search Section -->
        <section class="medcontainer">
            <div class="med">
                <h1>Medicine Info Finder <i class="fa-solid fa-pills"></i></h1>
                <input type="text" id="medicineName" placeholder="Enter medicine name or composition" />
                <button class="med-search" id="searchBtn">Search <i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <!-- Suggested Search Chips -->
            <div id="suggestedSearches" class="suggested-chips">
                <span class="chip">Paracetamol</span>
                <span class="chip">Ibuprofen</span>
                <span class="chip">Amoxicillin</span>
                <span class="chip">Vitamin C</span>
            </div>

            <!-- Search Results -->
            <div id="result" class="tiles-container"></div>
        </section>

        <!-- Modal for Medicine Details -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="modalDetails"></div>
            </div>
        </div>

        <!-- Medicine Categories -->
        <section class="medicine-types">
            <div class="medical-container">
                <div class="category">
                    <h1>Pain Relief</h1>
                    <img src="./assets/images/Painkiller.jpg" alt="Pain relief">
                    <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
                <div class="category">
                    <h1>Antibiotics</h1>
                    <img src="./assets/images/Antibiotics.jpg" alt="Antibiotics">
                    <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
                <div class="category">
                    <h1>Vitamins & Supplements</h1>
                    <img src="./assets/images/close-vitamins-supplements-on-white Better.jpg"
                        alt="Vitamins & Supplements">
                    <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
                <div class="category">
                    <h1>Allergy Care</h1>
                    <img src="./assets/images/Allergy.jpg" alt="Allergy Care">
                    <div class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Back to Top Button -->
    <a href="#top" class="back-top-btn" aria-label="back to top">
        <i class="fa-solid fa-chevron-up"></i>
    </a>

</body>

</html>
